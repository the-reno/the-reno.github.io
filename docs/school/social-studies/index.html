<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Studies Practice Test | Ronu</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#f4f8fd;color:#25354b;font:16px/1.55 Nunito,system-ui,sans-serif}header{background:linear-gradient(120deg,#e2f1ff,#f7eaff);padding:30px 20px;border-bottom:1px solid #d5e2ef}main,.wrap{max-width:860px;margin:auto}main{padding:20px 16px 80px}h1{font-size:clamp(27px,5vw,39px);line-height:1.18;margin:5px 0 10px}h2{font-size:20px}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#4b6c91;font-weight:900}.muted{color:#61738a}.card{background:white;border:1px solid #dce5ef;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #32516b0b}.pill{font-size:12px;border-radius:30px;padding:4px 11px;font-weight:900;display:inline-block}.green{background:#d9f7e4;color:#207248}.yellow{background:#fff0bc;color:#865900}.red{background:#ffe0e2;color:#9f3440}.option{display:block;padding:13px;border:1px solid #d2deea;border-radius:12px;margin:10px 0;cursor:pointer}.option:has(input:checked){border-color:#4982cb;background:#e8f2ff}.option input{margin-right:12px;accent-color:#346db1}button,.button{background:#315fa8;border:0;color:white;padding:13px 19px;border-radius:12px;font:800 16px Nunito,system-ui;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e4ebf5;color:#24476d}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input[type=text]{padding:10px;border:1px solid #b8c9d9;border-radius:9px;font:inherit}#status{font-weight:800}details{padding:14px 0;border-bottom:1px solid #dce5ef}summary{cursor:pointer;font-weight:800}canvas{max-width:100%;height:auto;border-radius:12px;border:1px solid #dce5ef}a{color:#275f9d}.correct{border-left:5px solid #26996c}.wrong{border-left:5px solid #cf5360}.pending{border-left:5px solid #c9d5e1}</style></head><body><header><div class="wrap"><div class="eyebrow">Ronu School · 7th Grade</div><h1>Ancient Rome: The Roman Republic</h1><p class="muted">Social Studies · Practice Test · 30 questions</p><div class="row"><span class="pill green">Green · Recall</span><span class="pill yellow">Yellow · Understand</span><span class="pill red">Red · Analyze</span></div></div></header><main><section class="card"><label><strong>Student name</strong> <input id="student" type="text" value="Sofia" maxlength="45"></label><p id="progress" class="muted">0 of 30 answered</p><p>Read carefully and choose one answer for each question. You can change your choices until you submit.</p><p id="sync" class="muted"></p></section><form id="test"></form><section class="card" id="finish"><button id="submit" type="button">Submit test</button><p id="status" role="status"></p></section></main><script>
const questions=[["Who ruled Rome before the Republic was established in 509 BCE?",["Etruscan kings","Greek emperors","Plebeian tribunes","Roman consuls"]],["What happened in Rome in 509 BCE?",["The Twelve Tables were published","Rome became a republic","Plebeians gained full legislative authority","Rome became an empire"]],["Which group initially dominated government offices?",["Enslaved people","Plebeians","Patricians","Foreign merchants"]],["Why did plebeians protest in 494 BCE?",["To demand political protection","To restore the kings","To end all trade","To invade Greece"]],["What was the purpose of the Twelve Tables?",["To select kings","To establish the army","To publish laws in writing","To abolish the Senate"]],["What could a plebeian tribune do?",["Appoint a king","Veto certain official actions","Command every army","Abolish taxes"]],["Could women vote in Roman citizen assemblies?",["Yes, all women","Yes, patrician women only","Yes, married women only","No"]],["What did the Lex Hortensia of 287 BCE establish?",["Plebeian assembly decisions bound all citizens","The Roman monarchy returned","The Senate was abolished","Greek became Rome's official language"]],["Which architectural technique was influenced by the Etruscans?",["Glass skyscrapers","Concrete elevators","Arches","Steel bridges"]],["Which cultural area was strongly influenced by the Greeks?",["Modern computers","Roman mythology and religion","Rail transportation","Printing presses"]],["Why did the Romans elect two consuls instead of one chief magistrate?",["To divide executive power and limit individual control","To give each social class its own king","To allow the Senate to appoint emperors","To eliminate the need for elections"]],["Which statement best describes the Roman Senate during the middle Republic?",["It was a court composed only of plebeian tribunes","It advised magistrates and strongly influenced finance and foreign policy","It was directly elected by all women and men","It was responsible only for religious festivals"]],["What did the Licinian-Sextian reforms of 367 BCE help make possible?",["The immediate abolition of slavery","The creation of the Roman Empire","Plebeian access to the consulship","Voting rights for Roman women"]],["What was the main distinction between a Roman republic and a direct democracy?",["A republic has no citizen participation","In a republic, citizens elect officials to exercise important powers","A republic always has a hereditary king","Direct democracy requires a Senate"]],["Why did Rome's system of voting assemblies favor wealthier citizens?",["Votes were often organized in groups that gave wealthy classes disproportionate influence","Every enslaved person received two votes","Women held a majority of assembly seats","The poorest citizens controlled all voting groups"]],["What does 'veto' literally mean in Latin?",["I command","I forbid","I approve","I elect"]],["What was one major limitation of the Twelve Tables?",["They were never written down","They made every person politically equal","They preserved important social inequalities","They abolished property ownership"]],["Which event is traditionally associated with the first secession of the plebs?",["Plebeians withdrew their labor and military service","Patricians voluntarily surrendered all political offices","Rome conquered Carthage","The Senate appointed a permanent emperor"]],["Why was control of the Roman army politically important to plebeians?",["Only patricians served as soldiers","Plebeian citizens provided a substantial share of Rome's soldiers","Rome never fought wars during the Republic","Soldiers were forbidden to participate in politics"]],["Which best describes the Roman concept of 'mos maiorum'?",["A written constitution enacted in one year","The traditions and customs of the ancestors","A treaty with Greek city-states","A tax paid only by senators"]],["How did Roman citizenship differ from modern universal suffrage?",["All residents voted equally","Voting rights depended on legal status, gender, and citizenship","All enslaved people elected consuls","Citizens never voted for officials"]],["What was a Roman dictator during the Republic?",["A permanent hereditary monarch","An official appointed temporarily for extraordinary emergencies","A priest elected by enslaved people","A governor of every conquered province"]],["Which conflict eventually helped Rome dominate the western Mediterranean?",["The Peloponnesian War","The Punic Wars against Carthage","The Persian Wars","The Hundred Years' War"]],["How did expansion create tensions in the late Roman Republic?",["It eliminated competition for land","It increased wealth inequality and pressures over land and military loyalty","It ended the need for provincial government","It made all conquered peoples senators"]],["Why were the Gracchi brothers historically significant?",["They advocated reforms addressing land distribution and social tensions","They founded Rome's monarchy","They wrote the Twelve Tables","They commanded Carthage in the Punic Wars"]],["What was the significance of Julius Caesar crossing the Rubicon in 49 BCE?",["He began a civil war by bringing his army into Italy against senatorial authority","He signed a peace treaty with Carthage","He established the Twelve Tables","He became Rome's first elected tribune"]],["What political development followed Octavian's victory in Rome's civil wars?",["The monarchy of the Etruscan kings returned","The principate began under Augustus","The plebeian tribunate was first created","Rome abandoned its Mediterranean territories"]],["Which example best illustrates checks on power in the Roman Republic?",["Two consuls could obstruct each other's actions","A king inherited every public office","Senators were forbidden from advising magistrates","No magistrate faced any legal limits"]],["What is a key difference between Roman and modern constitutional systems?",["Rome relied heavily on traditions, laws, and institutions rather than one comprehensive written constitution","Rome had no laws or magistrates","Modern constitutions never restrict government power","Roman citizens had identical voting rights regardless of status"]],["Why did the Conflict of the Orders unfold over generations rather than end after one protest?",["Plebeians sought multiple legal and political reforms that were won gradually","Patricians and plebeians immediately became fully equal in 494 BCE","The Roman Republic ended in 494 BCE","No changes occurred after the first protest"]]];const params=new URLSearchParams(location.search);const sid=params.get('session'),studentToken=params.get('student');const API='/api/school';const form=document.getElementById('test');const storageKey='ronu-roman-v3-'+(sid||'local');let state={answers:{},submitted:false};try{state=Object.assign(state,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch{};const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));const syncMsg=document.getElementById('sync');let syncTimer=null;let serverReady=Boolean(sid&&studentToken);syncMsg.textContent=serverReady?'Checking live session…':'Local practice: live parent monitoring requires a session link from the parent page.';
function update(){document.getElementById('progress').textContent=Object.keys(state.answers).length+' of 30 answered';if(state.submitted){form.hidden=true;document.getElementById('submit').hidden=true;document.getElementById('status').textContent='Your test was submitted and will be analyzed. Thank you for your work!';} }
questions.forEach((q,i)=>{const card=document.createElement('section');card.className='card';const badge=document.createElement('span');badge.className='pill '+(i<10?'green':i<20?'yellow':'red');badge.textContent=i<10?'GREEN · RECALL':i<20?'YELLOW · UNDERSTAND':'RED · ANALYZE';const h=document.createElement('h2');h.textContent=(i+1)+'. '+q[0];card.append(badge,h);q[1].forEach((option,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.checked=state.answers[i]===j;input.disabled=state.submitted;label.append(input,document.createTextNode(String.fromCharCode(65+j)+'. '+option));card.append(label)});form.append(card)});
async function sync(submitted){if(!serverReady)return false;try{const r=await fetch(API+'/sessions/'+encodeURIComponent(sid)+'/student',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+studentToken},body:JSON.stringify({name:document.getElementById('student').value,answers:state.answers,submitted})});if(!r.ok)throw Error('Not connected');syncMsg.textContent='Live session connected';return true}catch{syncMsg.textContent='Live connection unavailable; progress is saved on this device.';return false}}
form.addEventListener('change',e=>{if(!e.target.matches('input[type=radio]')||state.submitted)return;state.answers[Number(e.target.name.slice(1))]=Number(e.target.value);save();update();clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),350)});
document.getElementById('submit').onclick=async()=>{if(state.submitted)return;if(Object.keys(state.answers).length!==30){document.getElementById('status').textContent='Please answer all 30 questions before submitting.';return}if(!confirm('Submit your test for review?'))return;if(serverReady){const ok=await sync(true);if(!ok){document.getElementById('status').textContent='Submission could not reach the parent dashboard. Check the connection and try again.';return}}state.submitted=true;save();update();window.scrollTo({top:0,behavior:'smooth'})};
update();if(serverReady)sync(false);
</script></body></html>
