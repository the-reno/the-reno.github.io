<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sequence · Ronu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:#090909}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#777}.shell{width:min(1480px,100%);display:grid;gap:14px}.top,.foot{display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#444}.top a{color:#777;text-decoration:none}.frame{position:relative;width:100%;aspect-ratio:2.32/1;max-height:78svh;overflow:hidden;border:1px solid #242424;border-radius:12px;background:#101010;box-shadow:0 26px 90px #0008;isolation:isolate;touch-action:pan-y}.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.015);transition:opacity .55s ease,transform 4.5s ease;filter:grayscale(1) contrast(1.06) brightness(.72)}.slide.active{opacity:1;transform:scale(1)}.young{object-position:center 52%}.present{object-position:68% center}.runner{object-position:center 38%}.shade{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(180deg,#0001,transparent 38%,#0003),radial-gradient(circle at 50% 45%,transparent 34%,#0005 100%)}button{border:0;background:none;color:#777;cursor:pointer}.arrow{position:absolute;top:50%;z-index:7;transform:translateY(-50%);width:54px;height:78px;font-size:2rem}.left{left:4px}.right{right:4px}.dots{display:flex;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:#242424}.dot.active{background:#777;transform:scale(1.3)}@media(max-width:720px){.frame{aspect-ratio:1.28/1;border-radius:9px}.young{object-position:60% center}.present{object-position:72% center}.runner{object-position:center 35%}.top span:last-child{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><a href="/">ronu.one</a><span>temporary sequence · memory / horizon / endurance</span></header>
<section class="frame" id="frame">
<img class="slide young active" src="./assets/young-memory.svg" alt="Young friends watching a football game at night">
<img class="slide present" src="./assets/present-reflection.webp?v=20260805" alt="Present reflective view toward Manhattan">
<img class="slide runner" src="./assets/runner-card.jpg?v=20260805" alt="Night runner moving beside the waterfront">
<button class="arrow left" id="prev" aria-label="Previous image">‹</button><button class="arrow right" id="next" aria-label="Next image">›</button><div class="shade"></div>
</section>
<footer class="foot"><span>tap · swipe · arrows</span><div class="dots" id="dots"></div></footer>
</main>
<script>
const slides=[...document.querySelectorAll('.slide')],dotsBox=document.getElementById('dots'),frame=document.getElementById('frame');let current=0,timer,startX=0;const dots=slides.map((_,i)=>{const b=document.createElement('button');b.className='dot'+(i?'':' active');b.onclick=()=>show(i);dotsBox.appendChild(b);return b});function show(i){current=(i+slides.length)%slides.length;slides.forEach((s,n)=>s.classList.toggle('active',n===current));dots.forEach((d,n)=>d.classList.toggle('active',n===current));restart()}function restart(){clearInterval(timer);timer=setInterval(()=>show(current+1),3600)}prev.onclick=e=>{e.stopPropagation();show(current-1)};next.onclick=e=>{e.stopPropagation();show(current+1)};frame.onclick=()=>show(current+1);frame.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});frame.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>35)show(current+(dx<0?1:-1))},{passive:true});restart();
</script>
</body>
</html>
