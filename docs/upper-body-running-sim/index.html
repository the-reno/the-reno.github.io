<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Upper Body Running Mechanics Lab</title>
<style>
:root{--bg:#090b0e;--glass:rgba(15,20,26,.88);--line:rgba(255,255,255,.11);--muted:#9ca7b3;--text:#f3f6f8;--chip:#202731;--accent:#f08a42}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}#app,#view{width:100%;height:100%;position:relative}#view{overflow:hidden;background:radial-gradient(circle at 48% 36%,#252b33 0%,#15191f 45%,#090b0e 100%)}canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:16px;top:14px;z-index:4;pointer-events:none}.hud h1{font-size:17px;margin:0 0 3px}.hud p{font-size:10px;margin:0;color:#a9b2bc}.top-actions{position:absolute;right:14px;top:12px;z-index:5;display:flex;gap:6px}.icon-btn,.preset{border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:9px;cursor:pointer}.icon-btn{min-width:44px;height:36px;padding:0 11px;font-size:11px;font-weight:700}.preset{height:30px;padding:0 10px;font-size:10px;font-weight:700;white-space:nowrap}.metrics-strip{position:absolute;left:14px;bottom:268px;z-index:5;display:grid;grid-template-columns:repeat(4,auto);gap:5px;pointer-events:none}.metric{min-width:94px;background:rgba(15,20,26,.74);border:1px solid var(--line);border-radius:9px;padding:6px 8px}.metric .k{font-size:8px;color:var(--muted)}.metric .v{font-size:13px;font-weight:760;margin-top:2px}.metric .s{font-size:7px;color:#74808c}.phase-wrap{position:absolute;right:14px;bottom:268px;z-index:5;width:150px;background:rgba(15,20,26,.74);border:1px solid var(--line);border-radius:9px;padding:7px 8px}.phase-row{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-bottom:4px}.phase{height:4px;background:#2b333c;border-radius:5px;overflow:hidden}.phase>div{height:100%;width:0;background:#eef2f6}.legend{position:absolute;left:14px;top:58px;z-index:4;font-size:8px;color:#8994a0;pointer-events:none}.legend b{color:#dce1e6}.controls-shell{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;width:min(900px,calc(100% - 18px));pointer-events:none}.control-panel{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 14px 42px rgba(0,0,0,.38)}.control-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.panel-title{font-size:10px;color:var(--muted)}.presets{display:flex;gap:5px;overflow-x:auto}.param-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.param{border:1px solid rgba(255,255,255,.075);background:rgba(255,255,255,.035);border-radius:10px;padding:7px 8px;color:#fff;text-align:left;cursor:pointer;min-width:0}.param.active{border-color:var(--accent);background:rgba(240,138,66,.10)}.param-name{display:block;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.param-value{display:flex;align-items:baseline;justify-content:space-between;gap:5px;margin-top:3px}.param-value strong{font-size:13px}.param-value small{font-size:7px;color:#77828d}.editor{display:grid;grid-template-columns:minmax(110px,1fr) 42px minmax(90px,120px) 42px minmax(160px,2fr);align-items:center;gap:7px;margin-top:8px;padding:8px;border-radius:11px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.065)}.editor-label .eyebrow{font-size:7px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.editor-label .name{font-size:12px;font-weight:750;margin-top:2px}.editor-btn{height:34px;border:0;border-radius:9px;background:var(--chip);color:#fff;font-size:20px;cursor:pointer}.editor-input{width:100%;height:34px;border:0;border-radius:9px;background:#10151b;color:#fff;text-align:center;font-size:16px;font-weight:800;appearance:textfield}.editor-range{width:100%;accent-color:var(--accent)}.hidden-input{display:none}@media(max-width:860px){.param-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.metrics-strip,.phase-wrap{bottom:316px}.editor{grid-template-columns:minmax(90px,1fr) 38px 86px 38px minmax(100px,1.5fr)}}@media(max-width:600px){.hud h1{font-size:14px}.hud p,.legend{display:none}.control-panel{padding:7px}.param-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.editor{grid-template-columns:1fr 36px 78px 36px;gap:5px;padding:6px}.editor-range{grid-column:1/-1}.metrics-strip{left:7px;bottom:344px;grid-template-columns:repeat(2,auto)}.phase-wrap{right:7px;bottom:344px;width:112px}}@media(max-width:410px){.param-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics-strip{display:none}.phase-wrap{bottom:394px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head>
<body><div id="app"><main id="view">
<div class="hud"><h1>Upper Body Running Mechanics</h1><p>Select a parameter, then adjust it below</p></div><div class="legend"><b>Orange</b> arm momentum &nbsp; <b>White</b> residual imbalance</div><div class="top-actions"><button class="icon-btn" id="front">Front</button><button class="icon-btn" id="side">Side</button></div>
<div class="metrics-strip"><div class="metric"><div class="k">Arm counter</div><div class="v" id="armMetric">0</div><div class="s">relative</div></div><div class="metric"><div class="k">Leg demand</div><div class="v" id="legMetric">0</div><div class="s">relative</div></div><div class="metric"><div class="k">Residual</div><div class="v" id="resMetric">0</div><div class="s">lower = balanced</div></div><div class="metric"><div class="k">Torso yaw</div><div class="v" id="yawMetric">0°</div><div class="s">model response</div></div></div><div class="phase-wrap"><div class="phase-row"><span>Gait cycle</span><span id="cycleVal">0%</span></div><div class="phase"><div id="cycleFill"></div></div></div>
<div class="controls-shell"><section class="control-panel"><div class="control-top"><div class="panel-title">Parameters</div><div class="presets"><button class="preset" id="natural">Natural</button><button class="preset" id="highKnee">High knee</button><button class="preset" id="strongArms">Strong arms</button><button class="preset" id="quietArms">Quiet arms</button></div></div>
<div class="param-grid"><button class="param active" data-param="cadence"><span class="param-name">Cadence</span><span class="param-value"><strong data-readout="cadence">176</strong><small>spm</small></span></button><button class="param" data-param="leg"><span class="param-name">Leg lift</span><span class="param-value"><strong data-readout="leg">42</strong><small>deg</small></span></button><button class="param" data-param="arm"><span class="param-name">Arm swing</span><span class="param-value"><strong data-readout="arm">34</strong><small>deg</small></span></button><button class="param" data-param="elbow"><span class="param-name">Elbow angle</span><span class="param-value"><strong data-readout="elbow">90</strong><small>deg</small></span></button><button class="param" data-param="freq"><span class="param-name">Arm frequency</span><span class="param-value"><strong data-readout="freq">1.00</strong><small>× stride</small></span></button><button class="param" data-param="phaseOff"><span class="param-name">Arm timing</span><span class="param-value"><strong data-readout="phaseOff">0</strong><small>deg</small></span></button><button class="param" data-param="torso"><span class="param-name">Torso response</span><span class="param-value"><strong data-readout="torso">58</strong><small>%</small></span></button></div>
<div class="editor"><div class="editor-label"><div class="eyebrow">Adjust selected</div><div class="name" id="selectedName">Cadence</div></div><button class="editor-btn" id="editorMinus">−</button><input class="editor-input" id="editorInput" type="number" value="176"><button class="editor-btn" id="editorPlus">+</button><input class="editor-range" id="editorRange" type="range" min="130" max="210" step="2" value="176"></div>
<input class="hidden-input" id="cadence" type="number" min="130" max="210" step="2" value="176"><span id="cadenceVal" hidden></span><input class="hidden-input" id="leg" type="number" min="20" max="65" step="2" value="42"><span id="legVal" hidden></span><input class="hidden-input" id="arm" type="number" min="0" max="70" step="2" value="34"><span id="armVal" hidden></span><input class="hidden-input" id="elbow" type="number" min="55" max="170" step="5" value="90"><span id="elbowVal" hidden></span><input class="hidden-input" id="freq" type="number" min="0.5" max="1.5" step="0.05" value="1"><span id="freqVal" hidden></span><input class="hidden-input" id="phaseOff" type="number" min="-60" max="60" step="5" value="0"><span id="phaseOffVal" hidden></span><input class="hidden-input" id="torso" type="number" min="0" max="100" step="5" value="58"><span id="torsoVal" hidden></span></section></div></main></div><script type="module" src="./sim.js"></script></body></html>
