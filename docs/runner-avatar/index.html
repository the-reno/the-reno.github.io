<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runner Avatar v1</title><style>
html,body{margin:0;height:100%;background:#101114;color:#f4f4f4;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:100vh}#view{position:relative;min-width:0;background:radial-gradient(circle at 50% 35%,#252931 0%,#15171b 48%,#0c0d10 100%)}canvas{display:block;width:100%;height:100%}#hud{position:absolute;left:18px;top:16px;pointer-events:none;text-shadow:0 1px 2px #000;z-index:2}#hud .title{font-weight:700;font-size:18px}.sub{font-size:12px;opacity:.7;margin-top:4px}#error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ddd;font-size:13px}#panel{box-sizing:border-box;padding:20px 18px;background:#17191e;border-left:1px solid #2a2d34;overflow:auto}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;line-height:1.45;color:#b9bdc7;margin:0 0 18px}.control{margin:0 0 18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:13px}.value{font-variant-numeric:tabular-nums;color:#dfe4ef}input[type=range]{width:100%}button{width:100%;border:1px solid #363a44;background:#23262d;color:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600;margin-bottom:9px}.section{margin-top:22px;padding-top:16px;border-top:1px solid #2a2d34}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini button{margin:0}#phasebar{height:8px;border-radius:5px;background:#252932;overflow:hidden;margin-top:7px}#phasefill{height:100%;width:0%;background:#c9ccd3}@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 290px}#panel{border-left:0;border-top:1px solid #2a2d34}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body>
<div id="app"><div id="view"><div id="hud"><div class="title">Runner Avatar v1</div><div class="sub">193 cm · 87 kg · US 12 · drag to rotate</div></div><div id="error">3D engine could not load.</div></div><aside id="panel"><h1>Biomechanics Controls</h1><p>Procedural male runner with humanized proportions and articulated joints.</p>
<div class="control"><div class="row"><span>Cadence</span><span class="value" id="cadenceVal">170 spm</span></div><input id="cadence" type="range" min="120" max="210" value="170"></div>
<div class="control"><div class="row"><span>Elbow angle</span><span class="value" id="elbowVal">90°</span></div><input id="elbow" type="range" min="60" max="130" value="90"></div>
<div class="control"><div class="row"><span>Arm swing</span><span class="value" id="armVal">34°</span></div><input id="arm" type="range" min="10" max="60" value="34"></div>
<div class="control"><div class="row"><span>Torso lean</span><span class="value" id="leanVal">6°</span></div><input id="lean" type="range" min="-4" max="18" value="6"></div>
<div class="control"><div class="row"><span>Stride amplitude</span><span class="value" id="strideVal">36°</span></div><input id="stride" type="range" min="15" max="55" value="36"></div>
<div class="control"><div class="row"><span>Playback speed</span><span class="value" id="speedVal">1.00×</span></div><input id="speed" type="range" min="0.15" max="1.8" step=".05" value="1"></div>
<button id="play">Pause</button><div class="mini"><button id="front">Front</button><button id="side">Side</button></div><div class="section"><div class="row"><span>Gait cycle</span><span class="value" id="phaseVal">0%</span></div><div id="phasebar"><div id="phasefill"></div></div></div></aside></div>
<script type="module">try{const THREE=await import('three');const{OrbitControls}=await import('three/addons/controls/OrbitControls.js');const view=document.getElementById('view'),scene=new THREE.Scene();scene.fog=new THREE.Fog(0x101114,8,18);const camera=new THREE.PerspectiveCamera(37,1,.1,100);camera.position.set(4.8,2.65,5.7);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.52,0);controls.minDistance=3.2;controls.maxDistance=10;
scene.add(new THREE.HemisphereLight(0xdfe7ff,0x20242a,2.25));const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x9fb5ff,1.35);rim.position.set(-5,4,-5);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x1d2026,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const mk=c=>new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:.01}),skin=mk(0xc99b7a),shirt=mk(0x424852),shorts=mk(0x2c3037),shoe=mk(0xe5e7eb),hairMat=mk(0x1b1715);const J=(p,x=0,y=0,z=0)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g};const shadow=m=>{m.castShadow=true;m.receiveShadow=true;return m};const ell=(p,r,sc,y,mat)=>{const m=shadow(new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat));m.scale.set(sc[0],sc[1],sc[2]);m.position.y=y;p.add(m);return m};function tapered(p,len,r1,r2,mat){const g=new THREE.Group();p.add(g);const upper=shadow(new THREE.Mesh(new THREE.CapsuleGeometry(r1,Math.max(.01,len*.48-r1*2),7,12),mat));upper.position.y=-len*.24;g.add(upper);const lower=shadow(new THREE.Mesh(new THREE.CapsuleGeometry(r2,Math.max(.01,len*.46-r2*2),7,12),mat));lower.position.y=-len*.72;g.add(lower);return g}
const runner=new THREE.Group();runner.position.y=.08;scene.add(runner);const pelvis=J(runner,0,1.93,0);ell(pelvis,.30,[1.18,.70,.82],-.05,shorts);const sacrum=ell(pelvis,.24,[1.02,.60,.78],.12,shorts);const torso=J(pelvis,0,.18,0);ell(torso,.36,[1.16,1.35,.68],.46,shirt);ell(torso,.32,[1.34,.88,.72],.72,shirt);ell(torso,.25,[1.04,.68,.64],.16,shirt);const clav=new THREE.Group();clav.position.y=.79;torso.add(clav);const clavbar=shadow(new THREE.Mesh(new THREE.CapsuleGeometry(.045,.72,6,10),shirt));clavbar.rotation.z=Math.PI/2;clav.add(clavbar);
const neck=J(torso,0,.96,0);ell(neck,.105,[.82,1.25,.78],.10,skin);const head=ell(neck,.235,[.83,1.10,.90],.39,skin);const jaw=ell(neck,.17,[.82,.55,.78],.27,skin);const hair=shadow(new THREE.Mesh(new THREE.SphereGeometry(.237,24,18,0,Math.PI*2,0,Math.PI/2.05),hairMat));hair.scale.copy(head.scale);hair.position.y=.42;neck.add(hair);
function arm(side){const shoulder=J(torso,side*.51,.77,0);ell(shoulder,.125,[1,.96,.92],0,skin);const upper=tapered(shoulder,.64,.105,.088,skin);const elbow=J(shoulder,0,-.64,0);ell(elbow,.09,[1,.82,.88],0,skin);const fore=tapered(elbow,.58,.087,.064,skin);const wrist=J(elbow,0,-.58,0);ell(wrist,.061,[1,.75,.92],0,skin);const hand=ell(wrist,.10,[.78,1.35,.56],-.13,skin);return{shoulder,elbow,wrist}}
const leftArm=arm(-1),rightArm=arm(1);
function leg(side){const hip=J(pelvis,side*.205,-.10,0);ell(hip,.13,[1,.95,.95],0,shorts);const thigh=tapered(hip,.86,.155,.118,shorts);const knee=J(hip,0,-.86,0);ell(knee,.105,[1,.88,.96],0,skin);const shinGroup=J(knee);const calf=ell(shinGroup,.145,[.78,1.55,.82],-.30,skin);const shin=tapered(shinGroup,.74,.105,.072,skin);const ankle=J(knee,0,-.76,0);ell(ankle,.072,[1,.72,.92],0,skin);const footRoot=J(ankle,0,-.06,.08);const foot=shadow(new THREE.Mesh(new THREE.CapsuleGeometry(.105,.34,7,12),shoe));foot.rotation.x=Math.PI/2;foot.scale.set(.96,1,1.12);foot.position.z=.18;footRoot.add(foot);const toe=ell(footRoot,.115,[1.06,.72,1.20],.01,shoe);toe.position.z=.39;return{hip,knee,ankle,footRoot}}
const leftLeg=leg(-1),rightLeg=leg(1);runner.rotation.y=THREE.MathUtils.degToRad(-18);
const ui={};['cadence','elbow','arm','lean','stride','speed'].forEach(id=>ui[id]=document.getElementById(id));const vals={cadence:document.getElementById('cadenceVal'),elbow:document.getElementById('elbowVal'),arm:document.getElementById('armVal'),lean:document.getElementById('leanVal'),stride:document.getElementById('strideVal'),speed:document.getElementById('speedVal')},phaseVal=document.getElementById('phaseVal'),phaseFill=document.getElementById('phasefill');function labels(){vals.cadence.textContent=`${ui.cadence.value} spm`;vals.elbow.textContent=`${ui.elbow.value}°`;vals.arm.textContent=`${ui.arm.value}°`;vals.lean.textContent=`${ui.lean.value}°`;vals.stride.textContent=`${ui.stride.value}°`;vals.speed.textContent=`${Number(ui.speed.value).toFixed(2)}×`}Object.values(ui).forEach(e=>e.addEventListener('input',labels));labels();let running=true;document.getElementById('play').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Pause':'Play'};document.getElementById('front').onclick=()=>{camera.position.set(0,2.8,6.7);controls.target.set(0,1.55,0);controls.update()};document.getElementById('side').onclick=()=>{camera.position.set(6.7,2.65,.1);controls.target.set(0,1.55,0);controls.update()};let t=0;const clock=new THREE.Clock(),deg=v=>THREE.MathUtils.degToRad(v);function pose(p){const elbow=+ui.elbow.value,arm=+ui.arm.value,lean=+ui.lean.value,stride=+ui.stride.value,s=Math.sin(p),c=Math.cos(p),s2=Math.sin(p+Math.PI);torso.rotation.x=deg(lean);torso.rotation.y=deg(2)*Math.sin(p*2);pelvis.rotation.y=deg(3)*Math.sin(p*2);pelvis.rotation.z=deg(1.3)*Math.sin(p*2+Math.PI/2);runner.position.y=.08+.026*Math.sin(p*2-Math.PI/2);leftLeg.hip.rotation.x=deg(stride)*s;rightLeg.hip.rotation.x=deg(stride)*s2;leftLeg.knee.rotation.x=deg(-(16+48*Math.max(0,-s)+12*Math.max(0,c)));rightLeg.knee.rotation.x=deg(-(16+48*Math.max(0,-s2)+12*Math.max(0,-c)));leftLeg.ankle.rotation.x=deg(8*c-4);rightLeg.ankle.rotation.x=deg(-8*c-4);leftArm.shoulder.rotation.x=deg(-arm)*s;rightArm.shoulder.rotation.x=deg(-arm)*s2;leftArm.shoulder.rotation.z=deg(-7);rightArm.shoulder.rotation.z=deg(7);leftArm.elbow.rotation.x=deg(180-elbow);rightArm.elbow.rotation.x=deg(180-elbow);leftArm.elbow.rotation.y=deg(-7);rightArm.elbow.rotation.y=deg(7);neck.rotation.x=deg(-lean*.5);neck.rotation.y=deg(-1.3)*Math.sin(p*2)}function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(running){const cps=(+ui.cadence.value)/120;t+=dt*cps*Math.PI*2*(+ui.speed.value)}pose(t);const pct=((t%(Math.PI*2))/(Math.PI*2)*100+100)%100;phaseVal.textContent=`${pct.toFixed(0)}%`;phaseFill.style.width=`${pct}%`;controls.update();renderer.render(scene,camera)}animate()}catch(err){console.error(err);const el=document.getElementById('error');el.style.display='flex';el.textContent='3D engine error: '+err.message}</script></body></html>
