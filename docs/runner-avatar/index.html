<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runner Avatar v2.0</title><style>html,body{margin:0;height:100%;background:#0d1014;color:#f4f4f4;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100vh}#view{position:relative;min-width:0;background:radial-gradient(circle at 48% 38%,#242a32 0%,#15191f 48%,#090b0e 100%)}canvas{display:block;width:100%;height:100%}#hud{position:absolute;left:20px;top:18px;z-index:2;pointer-events:none;text-shadow:0 1px 2px #000}.title{font-size:19px;font-weight:750}.sub{font-size:12px;opacity:.72;margin-top:4px}#error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ddd}#panel{box-sizing:border-box;padding:20px;background:#15191f;border-left:1px solid #2b3139;overflow:auto}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;color:#aeb6c1;line-height:1.45;margin:0 0 20px}.control{margin:0 0 17px}.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}.value{font-variant-numeric:tabular-nums;color:#e3e8ef}input[type=range]{width:100%}button{width:100%;padding:10px;border:1px solid #343b45;border-radius:8px;background:#232931;color:#fff;font-weight:650;cursor:pointer;margin-bottom:9px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini button{margin:0}.section{margin-top:22px;padding-top:16px;border-top:1px solid #2b3139}#phasebar{height:8px;background:#242a32;border-radius:6px;overflow:hidden}#phasefill{height:100%;width:0%;background:#cbd2dc}@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 300px}#panel{border-left:0;border-top:1px solid #2b3139}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><div id="app"><div id="view"><div id="hud"><div class="title">Runner Avatar v2.0</div><div class="sub">193 cm · 87 kg · US 12 · corrected foot geometry</div></div><div id="error"></div></div><aside id="panel"><h1>Biomechanics Controls</h1><p>Refined human silhouette, anatomically aligned feet and slower, smoother running cycle.</p><div class="control"><div class="row"><span>Cadence</span><span class="value" id="cadenceVal">158 spm</span></div><input id="cadence" type="range" min="120" max="200" value="158"></div><div class="control"><div class="row"><span>Elbow angle</span><span class="value" id="elbowVal">98°</span></div><input id="elbow" type="range" min="70" max="125" value="98"></div><div class="control"><div class="row"><span>Arm swing</span><span class="value" id="armVal">28°</span></div><input id="arm" type="range" min="10" max="50" value="28"></div><div class="control"><div class="row"><span>Torso lean</span><span class="value" id="leanVal">5°</span></div><input id="lean" type="range" min="-4" max="15" value="5"></div><div class="control"><div class="row"><span>Stride amplitude</span><span class="value" id="strideVal">32°</span></div><input id="stride" type="range" min="15" max="48" value="32"></div><div class="control"><div class="row"><span>Playback speed</span><span class="value" id="speedVal">0.55×</span></div><input id="speed" type="range" min="0.15" max="1.5" step=".05" value=".55"></div><button id="play">Pause</button><div class="mini"><button id="front">Front</button><button id="side">Side</button></div><div class="section"><div class="row"><span>Gait cycle</span><span class="value" id="phaseVal">0%</span></div><div id="phasebar"><div id="phasefill"></div></div></div></aside></div><script type="module">try{const THREE=await import('three');const{OrbitControls}=await import('three/addons/controls/OrbitControls.js');const view=document.getElementById('view');const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0d1014,8,18);const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(6.6,2.55,.12);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.075;controls.target.set(0,1.55,0);controls.minDistance=3.2;controls.maxDistance=10;scene.add(new THREE.HemisphereLight(0xdfe7ff,0x20252b,2.15));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x8aa5d9,1.25);rim.position.set(-5,4,-5);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(5.3,64),new THREE.MeshStandardMaterial({color:0x242a31,roughness:.96}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.68,metalness:.01});const skin=mat(0xb97a58),kit=mat(0x15191d),green=mat(0x67a92d),orange=mat(0xed5a2b),white=mat(0xe9ecef),dark=mat(0x111318),lens=mat(0xc85c16);const J=(p,x=0,y=0,z=0)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g};const cast=m=>{m.castShadow=true;m.receiveShadow=true;return m};const ell=(p,r,s,pos,m)=>{const o=cast(new THREE.Mesh(new THREE.SphereGeometry(r,28,20),m));o.scale.set(...s);o.position.set(...pos);p.add(o);return o};function seg(p,len,rTop,rBot,m){const o=cast(new THREE.Mesh(new THREE.CylinderGeometry(rBot,rTop,len,20,1,false),m));o.position.y=-len/2;p.add(o);return o}function shoeMesh(material,soleMat){const g=new THREE.Group();const geo=new THREE.BufferGeometry();const v=new Float32Array([-.095,-.045,.08,.095,-.045,.08,-.10,.055,.07,.10,.055,.07,-.115,-.05,-.31,.115,-.05,-.31,-.105,.045,-.37,.105,.045,-.37]);const idx=[0,2,1,1,2,3,4,5,6,5,7,6,0,1,4,1,5,4,2,6,3,3,6,7,0,4,2,2,4,6,1,3,5,3,7,5];geo.setAttribute('position',new THREE.BufferAttribute(v,3));geo.setIndex(idx);geo.computeVertexNormals();const body=cast(new THREE.Mesh(geo,material));g.add(body);const sole=cast(new THREE.Mesh(new THREE.BoxGeometry(.23,.028,.46),soleMat));sole.position.set(0,-.063,-.145);g.add(sole);const heel=ell(g,.075,[1,.62,.95],[0,-.01,.075],material);const toe=ell(g,.09,[1.02,.58,1.18],[0,-.005,-.35],material);return g}const runner=new THREE.Group();runner.position.y=.07;scene.add(runner);const pelvis=J(runner,0,1.86,0);ell(pelvis,.29,[1.03,.65,.78],[0,.02,0],kit);const torso=J(pelvis,0,.20,0);ell(torso,.34,[1.02,1.34,.65],[0,.44,0],kit);ell(torso,.30,[1.24,.86,.69],[0,.72,0],kit);const stripe=cast(new THREE.Mesh(new THREE.BoxGeometry(.64,.055,.018),green));stripe.position.set(0,.66,.218);torso.add(stripe);const neck=J(torso,0,.98,0);seg(neck,.17,.075,.082,skin).position.y=.085;const head=ell(neck,.224,[.80,1.08,.88],[0,.39,0],skin);ell(neck,.15,[.82,.52,.76],[0,.27,.015],skin);const cap=cast(new THREE.Mesh(new THREE.SphereGeometry(.228,26,18,0,Math.PI*2,0,Math.PI/2),dark));cap.scale.set(.81,1.08,.89);cap.position.y=.43;neck.add(cap);const glasses=cast(new THREE.Mesh(new THREE.BoxGeometry(.31,.052,.024),lens));glasses.position.set(0,.43,.19);neck.add(glasses);function arm(side){const shoulder=J(torso,side*.49,.77,0);ell(shoulder,.105,[1,.9,.9],[0,0,0],skin);seg(shoulder,.60,.095,.078,skin);const elbow=J(shoulder,0,-.60,0);ell(elbow,.066,[1,.88,.9],[0,0,0],skin);seg(elbow,.54,.078,.055,skin);const wrist=J(elbow,0,-.54,0);ell(wrist,.050,[1,.74,.9],[0,0,0],skin);ell(wrist,.09,[.70,1.20,.56],[0,-.12,.02],skin);return{shoulder,elbow,wrist}}const LA=arm(-1),RA=arm(1);function leg(side){const hip=J(pelvis,side*.19,-.08,0);seg(hip,.83,.145,.105,kit);const knee=J(hip,0,-.83,0);ell(knee,.078,[1,.86,.92],[0,0,0],skin);seg(knee,.71,.105,.065,skin);ell(knee,.105,[.72,1.22,.75],[0,-.28,-.02],skin);const ankle=J(knee,0,-.71,0);ell(ankle,.050,[1,.66,.84],[0,0,0],skin);const footRoot=J(ankle,0,-.045,0);footRoot.add(shoeMesh(orange,white));return{hip,knee,ankle,footRoot}}const LL=leg(-1),RL=leg(1);const ui={};['cadence','elbow','arm','lean','stride','speed'].forEach(id=>ui[id]=document.getElementById(id));const vals={cadence:document.getElementById('cadenceVal'),elbow:document.getElementById('elbowVal'),arm:document.getElementById('armVal'),lean:document.getElementById('leanVal'),stride:document.getElementById('strideVal'),speed:document.getElementById('speedVal')};const phaseVal=document.getElementById('phaseVal'),phaseFill=document.getElementById('phasefill');function labels(){vals.cadence.textContent=`${ui.cadence.value} spm`;vals.elbow.textContent=`${ui.elbow.value}°`;vals.arm.textContent=`${ui.arm.value}°`;vals.lean.textContent=`${ui.lean.value}°`;vals.stride.textContent=`${ui.stride.value}°`;vals.speed.textContent=`${Number(ui.speed.value).toFixed(2)}×`}Object.values(ui).forEach(e=>e.addEventListener('input',labels));labels();let running=true;document.getElementById('play').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Pause':'Play'};document.getElementById('front').onclick=()=>{camera.position.set(0,2.75,6.8);controls.target.set(0,1.55,0);controls.update()};document.getElementById('side').onclick=()=>{camera.position.set(6.6,2.55,.12);controls.target.set(0,1.55,0);controls.update()};const deg=v=>THREE.MathUtils.degToRad(v);let phase=.55;const clock=new THREE.Clock();function smoothWave(x){return Math.sin(x)*(.92+.08*Math.cos(x*2))}function pose(p){const elbow=+ui.elbow.value,arm=+ui.arm.value,lean=+ui.lean.value,stride=+ui.stride.value;const s=smoothWave(p),c=Math.cos(p),s2=-s;torso.rotation.x=deg(lean);torso.rotation.y=deg(1.4)*Math.sin(p*2);pelvis.rotation.y=deg(2.3)*Math.sin(p*2);pelvis.rotation.z=deg(1.1)*Math.sin(p*2+Math.PI/2);runner.position.y=.07+.014*(1-Math.cos(p*2));LL.hip.rotation.x=deg(stride)*s;RL.hip.rotation.x=deg(stride)*s2;const lk=10+48*Math.max(0,-s)+7*Math.max(0,c),rk=10+48*Math.max(0,-s2)+7*Math.max(0,-c);LL.knee.rotation.x=deg(-lk);RL.knee.rotation.x=deg(-rk);LL.ankle.rotation.x=deg(1-6*c);RL.ankle.rotation.x=deg(1+6*c);LL.footRoot.rotation.x=deg(-2+2.5*c);RL.footRoot.rotation.x=deg(-2-2.5*c);LA.shoulder.rotation.x=deg(-arm)*s;RA.shoulder.rotation.x=deg(-arm)*s2;LA.shoulder.rotation.z=deg(-5);RA.shoulder.rotation.z=deg(5);LA.elbow.rotation.x=deg(180-elbow);RA.elbow.rotation.x=deg(180-elbow);neck.rotation.x=deg(-lean*.42);neck.rotation.y=deg(-.9)*Math.sin(p*2)}function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(running){const cps=(+ui.cadence.value)/120;phase+=dt*cps*Math.PI*2*(+ui.speed.value)}pose(phase);const pct=((phase%(Math.PI*2))/(Math.PI*2)*100+100)%100;phaseVal.textContent=`${pct.toFixed(0)}%`;phaseFill.style.width=`${pct}%`;controls.update();renderer.render(scene,camera)}animate()}catch(err){console.error(err);const e=document.getElementById('error');e.style.display='flex';e.textContent='3D engine error: '+err.message}</script></body></html>
