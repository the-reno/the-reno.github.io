<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Runner Avatar v1</title>
  <style>
    html, body {margin:0;height:100%;background:#101114;color:#f4f4f4;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    #app{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:100vh}
    #view{position:relative;min-width:0;background:radial-gradient(circle at 50% 35%,#252931 0%,#15171b 48%,#0c0d10 100%)}
    canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;left:18px;top:16px;pointer-events:none;text-shadow:0 1px 2px #000}
    #hud .title{font-weight:700;font-size:18px;letter-spacing:.2px}.sub{font-size:12px;opacity:.7;margin-top:4px}
    #panel{box-sizing:border-box;padding:20px 18px;background:#17191e;border-left:1px solid #2a2d34;overflow:auto}
    h1{font-size:18px;margin:0 0 6px} p{font-size:12px;line-height:1.45;color:#b9bdc7;margin:0 0 18px}
    .control{margin:0 0 18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:13px}.value{font-variant-numeric:tabular-nums;color:#dfe4ef}
    input[type=range]{width:100%}button{width:100%;border:1px solid #363a44;background:#23262d;color:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600;margin-bottom:9px}button:hover{background:#2a2e36}
    .section{margin-top:22px;padding-top:16px;border-top:1px solid #2a2d34}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini button{margin:0}
    #phasebar{height:8px;border-radius:5px;background:#252932;overflow:hidden;margin-top:7px}#phasefill{height:100%;width:0%;background:#c9ccd3}
    @media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 290px}#panel{border-left:0;border-top:1px solid #2a2d34}}
  </style>
</head>
<body>
<div id="app">
  <div id="view"><div id="hud"><div class="title">Runner Avatar v1</div><div class="sub">Drag to rotate · wheel/pinch to zoom</div></div></div>
  <aside id="panel">
    <h1>Biomechanics Controls</h1>
    <p>Procedural articulated runner. Controls modify the live gait rather than playing a fixed animation.</p>
    <div class="control"><div class="row"><span>Cadence</span><span class="value" id="cadenceVal">170 spm</span></div><input id="cadence" type="range" min="120" max="210" step="1" value="170"></div>
    <div class="control"><div class="row"><span>Elbow angle</span><span class="value" id="elbowVal">90°</span></div><input id="elbow" type="range" min="60" max="130" step="1" value="90"></div>
    <div class="control"><div class="row"><span>Arm swing</span><span class="value" id="armVal">34°</span></div><input id="arm" type="range" min="10" max="60" step="1" value="34"></div>
    <div class="control"><div class="row"><span>Torso lean</span><span class="value" id="leanVal">6°</span></div><input id="lean" type="range" min="-4" max="18" step="1" value="6"></div>
    <div class="control"><div class="row"><span>Stride amplitude</span><span class="value" id="strideVal">36°</span></div><input id="stride" type="range" min="15" max="55" step="1" value="36"></div>
    <div class="control"><div class="row"><span>Playback speed</span><span class="value" id="speedVal">1.00×</span></div><input id="speed" type="range" min="0.15" max="1.8" step="0.05" value="1"></div>
    <button id="play">Pause</button>
    <div class="mini"><button id="front">Front</button><button id="side">Side</button></div>
    <div class="section"><div class="row"><span>Gait cycle</span><span class="value" id="phaseVal">0%</span></div><div id="phasebar"><div id="phasefill"></div></div></div>
  </aside>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const view=document.getElementById('view'),scene=new THREE.Scene();scene.fog=new THREE.Fog(0x101114,8,18);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(4.7,2.7,5.6);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.45,0);controls.minDistance=3.2;controls.maxDistance=10;
scene.add(new THREE.HemisphereLight(0xdfe7ff,0x20242a,2.2));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x9fb5ff,1.4);rim.position.set(-5,4,-5);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(4.8,64),new THREE.MeshStandardMaterial({color:0x1d2026,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const mk=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:.02}),skin=mk(0xc99b7a),cloth=mk(0x30343c),cloth2=mk(0x4d535f),shoe=mk(0xe5e7eb);
function joint(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g}
function limb(parent,len,radius,material,up=false){const m=new THREE.Mesh(new THREE.CapsuleGeometry(radius,Math.max(.01,len-radius*2),7,12),material);m.castShadow=true;m.receiveShadow=true;m.position.y=(up?1:-1)*len/2;parent.add(m);return m}
const runner=new THREE.Group();runner.position.y=.04;scene.add(runner);const pelvis=joint(runner,0,1.72,0);const pelvisMesh=new THREE.Mesh(new THREE.BoxGeometry(.58,.32,.32),cloth);pelvisMesh.castShadow=true;pelvis.add(pelvisMesh);
const torso=joint(pelvis,0,.20,0);const torsoMesh=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.62,8,16),cloth2);torsoMesh.scale.set(1.05,1,.72);torsoMesh.position.y=.42;torsoMesh.castShadow=true;torso.add(torsoMesh);
const neck=joint(torso,0,.91,0);limb(neck,.16,.075,skin,true);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,22,18),skin);head.scale.set(.86,1.08,.88);head.position.y=.34;head.castShadow=true;neck.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.224,22,18,0,Math.PI*2,0,Math.PI/2.05),mk(0x1b1715));hair.scale.copy(head.scale);hair.position.y=.37;neck.add(hair);
function makeArm(side){const shoulder=joint(torso,side*.43,.72,0);limb(shoulder,.58,.085,skin);const elbow=joint(shoulder,0,-.58,0);limb(elbow,.52,.073,skin);const wrist=joint(elbow,0,-.52,0);const hand=new THREE.Mesh(new THREE.SphereGeometry(.095,14,12),skin);hand.scale.set(.82,1.15,.72);hand.position.y=-.08;hand.castShadow=true;wrist.add(hand);return{shoulder,elbow,wrist}}
const leftArm=makeArm(-1),rightArm=makeArm(1);
function makeLeg(side){const hip=joint(pelvis,side*.19,-.12,0);limb(hip,.78,.115,cloth2);const knee=joint(hip,0,-.78,0);limb(knee,.74,.093,skin);const ankle=joint(knee,0,-.74,0);const foot=new THREE.Mesh(new THREE.BoxGeometry(.22,.15,.48),shoe);foot.position.set(0,-.08,.11);foot.castShadow=true;ankle.add(foot);return{hip,knee,ankle}}
const leftLeg=makeLeg(-1),rightLeg=makeLeg(1);runner.rotation.y=THREE.MathUtils.degToRad(-20);
const ui={};['cadence','elbow','arm','lean','stride','speed'].forEach(id=>ui[id]=document.getElementById(id));const vals={cadence:document.getElementById('cadenceVal'),elbow:document.getElementById('elbowVal'),arm:document.getElementById('armVal'),lean:document.getElementById('leanVal'),stride:document.getElementById('strideVal'),speed:document.getElementById('speedVal')};const phaseVal=document.getElementById('phaseVal'),phaseFill=document.getElementById('phasefill');
function labels(){vals.cadence.textContent=`${ui.cadence.value} spm`;vals.elbow.textContent=`${ui.elbow.value}°`;vals.arm.textContent=`${ui.arm.value}°`;vals.lean.textContent=`${ui.lean.value}°`;vals.stride.textContent=`${ui.stride.value}°`;vals.speed.textContent=`${Number(ui.speed.value).toFixed(2)}×`}Object.values(ui).forEach(el=>el.addEventListener('input',labels));labels();
let running=true;document.getElementById('play').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Pause':'Play'};document.getElementById('front').onclick=()=>{camera.position.set(0,2.6,6.4);controls.target.set(0,1.45,0);controls.update()};document.getElementById('side').onclick=()=>{camera.position.set(6.4,2.4,.1);controls.target.set(0,1.45,0);controls.update()};
let t=0;const clock=new THREE.Clock(),deg=v=>THREE.MathUtils.degToRad(v);
function pose(p){const elbow=+ui.elbow.value,arm=+ui.arm.value,lean=+ui.lean.value,stride=+ui.stride.value,s=Math.sin(p),c=Math.cos(p),s2=Math.sin(p+Math.PI);torso.rotation.x=deg(lean);torso.rotation.y=deg(2.2)*Math.sin(p*2);pelvis.rotation.y=deg(3)*Math.sin(p*2);pelvis.rotation.z=deg(1.5)*Math.sin(p*2+Math.PI/2);runner.position.y=.04+.025*Math.sin(p*2-Math.PI/2);leftLeg.hip.rotation.x=deg(stride)*s;rightLeg.hip.rotation.x=deg(stride)*s2;leftLeg.knee.rotation.x=deg(-(18+47*Math.max(0,-s)+13*Math.max(0,c)));rightLeg.knee.rotation.x=deg(-(18+47*Math.max(0,-s2)+13*Math.max(0,-c)));leftLeg.ankle.rotation.x=deg(8*c-5);rightLeg.ankle.rotation.x=deg(-8*c-5);leftArm.shoulder.rotation.x=deg(-arm)*s;rightArm.shoulder.rotation.x=deg(-arm)*s2;leftArm.shoulder.rotation.z=deg(-5);rightArm.shoulder.rotation.z=deg(5);leftArm.elbow.rotation.x=deg(180-elbow);rightArm.elbow.rotation.x=deg(180-elbow);leftArm.elbow.rotation.y=deg(-6);rightArm.elbow.rotation.y=deg(6);neck.rotation.x=deg(-lean*.55);neck.rotation.y=deg(-1.5)*Math.sin(p*2)}
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(running){const cps=(+ui.cadence.value)/120;t+=dt*cps*Math.PI*2*(+ui.speed.value)}pose(t);const pct=((t%(Math.PI*2))/(Math.PI*2)*100+100)%100;phaseVal.textContent=`${pct.toFixed(0)}%`;phaseFill.style.width=`${pct}%`;controls.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
