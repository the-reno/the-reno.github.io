<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Basement · Ronu</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' data:; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="./execution.css?v=7" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="view" aria-label="Interactive basement 3D model"></main>
    <div id="labels" aria-label="Model annotations"></div>

    <header class="topbar">
      <div class="brand"><b>RONU</b><span> / BASEMENT</span></div>
      <div class="top-actions">
        <button id="project" class="surface" aria-label="Project images">
          Project
        </button>
        <button
          id="execution"
          class="surface"
          aria-haspopup="dialog"
          aria-controls="execution-panel"
          aria-expanded="false"
          disabled
        >
          Execution
        </button>
        <nav class="surface camera" aria-label="Camera views">
          <button id="top" disabled aria-pressed="false">Top</button>
          <button id="three" disabled aria-pressed="true">3D</button>
          <button id="reset" disabled>Reset</button>
        </nav>
      </div>
    </header>
    <aside id="show-panel" class="surface" aria-label="Show on model">
      <div class="show-heading">
        <h1>Show</h1>
        <details id="add-tools">
          <summary>Add</summary>
          <nav class="surface" aria-label="Create annotation">
            <button data-mode="measure" aria-pressed="false" disabled>
              Measure
            </button>
            <button data-mode="area" aria-pressed="false" disabled>Area</button>
            <button data-mode="comment" aria-pressed="false" disabled>
              Comment
            </button>
          </nav>
        </details>
      </div>
      <nav class="source-switch" aria-label="Dimension source">
        <button data-source="model" aria-pressed="true">3D dimensions</button>
        <button data-source="lighting" aria-pressed="false">
          Lighting plan
        </button>
      </nav>
      <div id="show-controls"></div>
      <div id="measure-list" aria-label="Choose wall lengths"></div>
      <div class="show-summary">
        <span
          id="model-area"
          title="Approximate scan footprint, including walls and stairs"
        ></span>
        <span
          id="area-total"
          title="Sum of saved areas currently shown"
          hidden
        ></span>
        <button
          id="hidden-notes"
          aria-label="Show hidden notes"
          hidden
        ></button>
        <span id="save-state" role="status">Saved on this device</span>
      </div>
    </aside>
    <button
      id="plan-note"
      class="surface"
      hidden
      aria-label="Open plan dimensions"
    ></button>

    <div id="status" class="surface" role="status" aria-live="polite">
      Loading your basement…
    </div>

    <div class="prompt surface" id="prompt" hidden>
      <span id="instruction"></span>
      <div id="drawing-actions" hidden>
        <button id="undo-point">Undo</button>
        <button id="finish-area" class="accent" disabled>Done</button>
        <button id="cancel-drawing">Cancel</button>
      </div>
    </div>

    <aside id="panel" class="surface" hidden aria-label="Edit selected item">
      <div class="panel-head">
        <h1 id="panel-title"></h1>
        <button id="close-panel" aria-label="Close editor">×</button>
      </div>
      <div id="panel-body"></div>
    </aside>

    <aside
      id="project-panel"
      class="surface project-panel"
      hidden
      aria-label="Project image gallery"
    >
      <div class="panel-head">
        <h1>Project images</h1>
        <button id="close-project" aria-label="Close project reference">
          ×
        </button>
      </div>
      <p class="small">
        Studio Duo drawings. The lighting sheet locates spotlights and other
        fixtures; its red dimensions are spacing and offsets.
      </p>
      <div
        id="project-reference-list"
        class="project-reference-list"
        aria-label="Choose a project image"
      ></div>
      <figure class="project-preview">
        <a
          id="open-project-image"
          href="./lighting-sheet.png"
          target="_blank"
          rel="noopener"
          aria-label="Open selected image at full size"
        >
          <img
            id="project-image"
            class="lighting-plan"
            loading="lazy"
            alt="Lighting plan"
          />
          <span>Open full-size image</span>
        </a>
        <figcaption id="project-image-note"></figcaption>
      </figure>
      <div id="lighting-dimensions"></div>
    </aside>

    <dialog
      id="execution-panel"
      class="surface"
      aria-labelledby="execution-title"
    >
      <div class="panel-head">
        <h1 id="execution-title">Execution / Ceiling</h1>
        <button id="close-execution" aria-label="Close execution">×</button>
      </div>
      <div id="ceiling-content"></div>
    </dialog>

    <div
      id="toast"
      class="surface"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <script type="module" src="./app.mjs?v=7"></script>
  </body>
</html>
