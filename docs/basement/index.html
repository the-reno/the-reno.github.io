<!doctype html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eeede9;color:#242421;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:fixed;z-index:2;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}.brand,nav{background:#fafaf7eb;border:1px solid #d3d2cb;border-radius:8px;box-shadow:0 3px 14px #00000008;pointer-events:auto}.brand{padding:12px 15px;letter-spacing:.08em}.brand b{color:#b6632b}nav{display:flex;padding:4px;gap:3px}button{font:inherit;color:inherit;background:none;border:0;border-radius:4px;min-height:40px;padding:0 15px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#e7e6df}button:focus-visible{outline:2px solid #b6632b;outline-offset:2px}button:disabled{opacity:.4;cursor:wait}.hint{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;color:#65655e;pointer-events:none}#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 22px;background:#fafaf7ed;border:1px solid #d3d2cb;border-radius:8px;max-width:85%;text-align:center}#status[hidden]{display:none}.touch{display:none}@media(max-width:600px){.brand{padding:10px;font-size:10px}.brand span{display:none}button{padding:0 11px}.hint{font-size:10px}.desktop{display:none}.touch{display:inline}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<main id="view" aria-label="Interactive basement 3D model"></main>
<header class="bar"><div class="brand"><b>RONU</b><span> / WORKSPACE</span> · BASEMENT</div><nav aria-label="Camera views"><button id="top" disabled aria-pressed="false">Top</button><button id="three" disabled aria-pressed="true">3D</button><button id="reset" disabled>Reset</button></nav></header>
<div id="status" role="status" aria-live="polite">Loading your basement…</div>
<div class="hint"><span class="desktop">Drag to orbit · Scroll to zoom · Right-drag to pan</span><span class="touch">One finger to orbit · Pinch to zoom · Two fingers to pan</span></div>
<script type="module">
const status=document.querySelector('#status');
try {
 const [THREE,{OrbitControls},{GLTFLoader}]=await Promise.all([import('three'),import('three/addons/controls/OrbitControls.js'),import('three/addons/loaders/GLTFLoader.js')]);
 const host=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color(0xeeede9);
 const camera=new THREE.PerspectiveCamera(45,1,.01,1000);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));host.append(renderer.domElement);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.screenSpacePanning=true;
 scene.add(new THREE.HemisphereLight(0xffffff,0x8d8b81,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(5,10,7);scene.add(light);
 const gltf=await new GLTFLoader().loadAsync('./room.gltf');const model=gltf.scene;scene.add(model);
 model.traverse(o=>{if(o.isMesh){o.geometry.computeVertexNormals();const edges=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,30),new THREE.LineBasicMaterial({color:0x77786f,transparent:true,opacity:.4}));o.add(edges);}});
 const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 if(box.isEmpty()||!Number.isFinite(size.length())||size.length()===0)throw new Error('Empty model');
 const radius=size.length()/2;camera.near=radius/1000;camera.far=radius*100;controls.minDistance=radius*.025;controls.maxDistance=radius*12;
 let mode='three';
 function fit(next=mode){mode=next;controls.target.copy(center);camera.up.set(0,1,0);const halfFov=Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*Math.min(camera.aspect,1));const distance=radius/Math.sin(halfFov)*1.15;
 camera.position.copy(center).add(new THREE.Vector3(...(mode==='top'?[0,1,.00001]:[1,.85,1])).normalize().multiplyScalar(distance));camera.updateProjectionMatrix();controls.update();document.querySelector('#top').setAttribute('aria-pressed',String(mode==='top'));document.querySelector('#three').setAttribute('aria-pressed',String(mode==='three'));}
 const resize=()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};new ResizeObserver(resize).observe(host);resize();fit('three');
 document.querySelector('#top').onclick=()=>fit('top');document.querySelector('#three').onclick=()=>fit('three');document.querySelector('#reset').onclick=()=>fit('three');document.querySelectorAll('button').forEach(b=>b.disabled=false);status.hidden=true;
 renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='3D view interrupted. Reload this page to continue.';});
 renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
} catch(error){console.error(error);status.hidden=false;status.textContent=/WebGL|context/i.test(error.message)?'3D requires WebGL. Enable browser graphics acceleration or open this page in another browser.':'Could not open the 3D model. Please reload the page to try again.';}
</script>
</body>
