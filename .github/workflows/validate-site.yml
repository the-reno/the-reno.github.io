name: Validate site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_site.py
      - run: node scripts/test_analytics.js
      - run: node scripts/test_basement.mjs
      - run: node scripts/test_basement_metrics.mjs
